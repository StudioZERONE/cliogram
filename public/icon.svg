<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Elegant Forest Green Gradient for Vector Lines -->
    <linearGradient id="kliogram-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="kliogram-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="vector-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#059669" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 100% Transparent Background for Light & Dark Mode Compatibility (No Outer Box) -->

  <!-- Line Art & Gradient Forest Icon -->
  <g filter="url(#vector-shadow)">
    <!-- Outer Shield Frame Line -->
    <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="url(#kliogram-stroke)" stroke-width="20" stroke-linecap="round"/>

    <!-- Distant Forest Layer (Line Art) -->
    <path d="M190 280 L238 180 L212 180 L248 115 L228 115 L256 65 L284 115 L264 115 L300 180 L274 180 L322 280 Z" fill="none" stroke="url(#kliogram-stroke)" stroke-width="14" stroke-linejoin="round" opacity="0.6"/>

    <!-- Main Noble Pine Tree (Solid Gradient Fill) -->
    <path d="M256 90 L145 250 H192 L115 360 H215 V420 H297 V360 H397 L320 250 H367 Z" fill="url(#kliogram-fill)"/>

    <!-- Flowing Stream Path (Line Curve) -->
    <path d="M90 435 C 170 410, 230 450, 310 430 C 370 415, 415 425, 445 430" fill="none" stroke="#6ee7b7" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
