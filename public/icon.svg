<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Forest Theme Gradient -->
    <linearGradient id="forest-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    
    <linearGradient id="leaf-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    
    <linearGradient id="accent-flow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield/Tile -->
  <rect width="512" height="512" rx="128" fill="url(#forest-bg)"/>
  
  <!-- Subtle Inner Ring/Aura -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#6ee7b7" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Iconic Forest Tree + Flowing Path Symbol -->
  <g filter="url(#soft-shadow)">
    <!-- Back Layer Trees (Distant Forest Layer) -->
    <path d="M190 280 L235 190 L210 190 L245 130 L225 130 L256 80 L287 130 L267 130 L302 190 L277 190 L322 280 Z" fill="#047857" opacity="0.6"/>
    
    <!-- Main Center Pine Tree (Forest Trunk & Canopy) -->
    <path d="M256 120 L160 270 H205 L135 370 H220 V420 H292 V370 H377 L307 270 H352 Z" fill="url(#accent-flow)"/>
    
    <!-- Stylized K-Shape Branch Curve (Integrating 'K' into Tree Lines) -->
    <path d="M175 350 C210 320 256 250 256 200 C256 250 302 320 337 350" fill="none" stroke="#a7f3d0" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
    
    <!-- Flowing River / Financial Stream Path at base -->
    <path d="M110 430 C 180 410, 230 450, 310 430 C 360 415, 400 425, 430 430" fill="none" stroke="url(#leaf-glow)" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
