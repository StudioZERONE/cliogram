<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 10시(0%, 0%) -> 4시(100%, 100%) 너무 어둡지 않고 맑고 점잖은 세련된 에메랄드 숲 그라데이션 -->
    <linearGradient id="bg-forest-natural" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#045d47" />
      <stop offset="100%" stop-color="#0d856d" />
    </linearGradient>
  </defs>

  <!-- 1. 배경: 둥근 모서리 사각형 (다크/라이트 모드 모두 조화로운 맑고 점잖은 그린) -->
  <rect width="512" height="512" rx="112" fill="url(#bg-forest-natural)"/>

  <!-- 2. 모던 기하학 숲 심볼 (100% Solid - 자연스러운 거리감 및 크기 비대칭 밸런스) -->
  <g>
    <!-- [좌측 배경 숲 나무]: 중앙에서 더 멀고, 아담한 크기 (깊은 원경) -->
    <!-- 하단 티어 -->
    <path d="M125 295 L65 385 H185 Z" fill="#024736" />
    <!-- 중단 티어 -->
    <path d="M125 240 L85 305 H165 Z" fill="#024736" />
    <!-- 상단 티어 -->
    <path d="M125 185 L95 248 H155 Z" fill="#024736" />

    <!-- [우측 배경 숲 나무]: 중앙에 더 가깝고, 좌측 나무보다 조금 더 큼 (중경) -->
    <!-- 하단 티어 -->
    <path d="M365 265 L290 385 H440 Z" fill="#0f766e" />
    <!-- 중단 티어 -->
    <path d="M365 205 L312 278 H418 Z" fill="#0f766e" />
    <!-- 상단 티어 -->
    <path d="M365 145 L325 218 H405 Z" fill="#0f766e" />

    <!-- [전면 메인 상록수 - 기둥] -->
    <rect x="240" y="380" width="32" height="42" rx="4" fill="#ffffff" />

    <!-- [전면 메인 상록수 - 좌측 반면 (순백색 Solid)] -->
    <!-- 하단 3단 -->
    <path d="M256 245 L145 380 H256 Z" fill="#ffffff" />
    <!-- 중단 2단 -->
    <path d="M256 175 L175 265 H256 Z" fill="#ffffff" />
    <!-- 상단 1단 (단아하고 시원한 단일 꼭지점) -->
    <path d="M256 100 L205 190 H256 Z" fill="#ffffff" />

    <!-- [전면 메인 상록수 - 우측 반면 (소프트 아이스민트 Solid - 모던 입체감)] -->
    <!-- 하단 3단 -->
    <path d="M256 245 L367 380 H256 Z" fill="#e0f7ef" />
    <!-- 중단 2단 -->
    <path d="M256 175 L337 265 H256 Z" fill="#e0f7ef" />
    <!-- 상단 1단 -->
    <path d="M256 100 L307 190 H256 Z" fill="#e0f7ef" />
  </g>
</svg>
