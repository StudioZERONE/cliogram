<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 10시(0%, 0%) -> 4시(100%, 100%) 너무 어둡지 않고 맑고 점잖은 에메랄드 숲 그라데이션 -->
    <linearGradient id="bg-forest-natural" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#045d47" />
      <stop offset="100%" stop-color="#0d856d" />
    </linearGradient>
  </defs>

  <!-- 1. 배경: 둥근 모서리 사각형 (10시 -> 4시 부드러운 숲 그라데이션) -->
  <rect width="512" height="512" rx="112" fill="url(#bg-forest-natural)"/>

  <!-- 2. 모던 기하학 숲 심볼 (사다리꼴 레이어링으로 연결부를 듬직하고 통통하게 살찌움) -->
  <g>
    <!-- [좌측 배경 숲 나무]: 사다리꼴 연결부로 듬직하게 (#045842) -->
    <!-- 하단 3단 사다리꼴 (밑선 Y=385) -->
    <path d="M96 285 H154 L208 385 H42 Z" fill="#045842" />
    <!-- 중단 2단 사다리꼴 -->
    <path d="M108 228 H142 L180 305 H70 Z" fill="#045842" />
    <!-- 상단 1단 꼭대기 -->
    <path d="M125 180 L92 248 H158 Z" fill="#045842" />

    <!-- [우측 배경 숲 나무]: 사다리꼴 연결부로 듬직하게 (#033d2e) -->
    <!-- 하단 3단 사다리꼴 (밑선 Y=385) -->
    <path d="M330 250 H400 L460 385 H270 Z" fill="#033d2e" />
    <!-- 중단 2단 사다리꼴 -->
    <path d="M342 190 H388 L435 275 H295 Z" fill="#033d2e" />
    <!-- 상단 1단 꼭대기 -->
    <path d="M365 140 L320 215 H410 Z" fill="#033d2e" />

    <!-- [전면 메인 상록수 - 기둥] -->
    <rect x="234" y="385" width="44" height="42" rx="4" fill="#ffffff" />

    <!-- [전면 메인 상록수 - 좌측 반면 (순백색 Solid)] -->
    <!-- 하단 3단 사다리꼴 (밑선 Y=385) -->
    <path d="M200 245 H256 V385 H115 Z" fill="#ffffff" />
    <!-- 중단 2단 사다리꼴 -->
    <path d="M220 165 H256 V275 H148 Z" fill="#ffffff" />
    <!-- 상단 1단 꼭대기 -->
    <path d="M256 90 L185 195 H256 Z" fill="#ffffff" />

    <!-- [전면 메인 상록수 - 우측 반면 (소프트 아이스민트 Solid)] -->
    <!-- 하단 3단 사다리꼴 (밑선 Y=385) -->
    <path d="M256 245 H312 L397 385 H256 Z" fill="#e0f7ef" />
    <!-- 중단 2단 사다리꼴 -->
    <path d="M256 165 H292 L364 275 H256 Z" fill="#e0f7ef" />
    <!-- 상단 1단 꼭대기 -->
    <path d="M256 90 L327 195 H256 Z" fill="#e0f7ef" />
  </g>
</svg>
