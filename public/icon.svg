<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 10시(0%, 0%) -> 4시(100%, 100%) 너무 어둡지 않고 맑고 점잖은 에메랄드 숲 그라데이션 -->
    <linearGradient id="bg-forest-natural" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#045d47" />
      <stop offset="100%" stop-color="#0d856d" />
    </linearGradient>
  </defs>

  <!-- 1. 배경: 둥근 모서리 사각형 (10시 -> 4시 부드러운 숲 그라데이션) -->
  <rect width="512" height="512" rx="112" fill="url(#bg-forest-natural)"/>

  <!-- 2. 모던 기하학 숲 심볼 (100% Solid - 풍성한 볼륨감 및 완벽한 밑선 정렬) -->
  <g>
    <!-- [좌측 배경 숲 나무]: 볼륨 확장, 살짝 옅어진 숲 그린 (#045842) -->
    <!-- 하단 티어 (밑선 Y=385) -->
    <path d="M125 285 L45 385 H205 Z" fill="#045842" />
    <!-- 중단 티어 -->
    <path d="M125 230 L72 300 H178 Z" fill="#045842" />
    <!-- 상단 티어 -->
    <path d="M125 180 L92 245 H158 Z" fill="#045842" />

    <!-- [우측 배경 숲 나무]: 볼륨 확장, 배경과 대비되어 또렷한 딥 숲 그린 (#033d2e) -->
    <!-- 하단 티어 (밑선 Y=385) -->
    <path d="M365 250 L275 385 H455 Z" fill="#033d2e" />
    <!-- 중단 티어 -->
    <path d="M365 190 L300 270 H430 Z" fill="#033d2e" />
    <!-- 상단 티어 -->
    <path d="M365 140 L322 210 H408 Z" fill="#033d2e" />

    <!-- [전면 메인 상록수 - 기둥] -->
    <rect x="236" y="385" width="40" height="42" rx="4" fill="#ffffff" />

    <!-- [전면 메인 상록수 - 좌측 반면 (순백색 Solid, 풍성하게 살찌움)] -->
    <!-- 하단 3단 (밑선 Y=385) -->
    <path d="M256 240 L120 385 H256 Z" fill="#ffffff" />
    <!-- 중단 2단 -->
    <path d="M256 165 L155 270 H256 Z" fill="#ffffff" />
    <!-- 상단 1단 (단아하고 시원한 꼭지점) -->
    <path d="M256 90 L190 190 H256 Z" fill="#ffffff" />

    <!-- [전면 메인 상록수 - 우측 반면 (소프트 아이스민트 Solid, 풍성하게 살찌움)] -->
    <!-- 하단 3단 (밑선 Y=385) -->
    <path d="M256 240 L392 385 H256 Z" fill="#e0f7ef" />
    <!-- 중단 2단 -->
    <path d="M256 165 L357 270 H256 Z" fill="#e0f7ef" />
    <!-- 상단 1단 -->
    <path d="M256 90 L322 190 H256 Z" fill="#e0f7ef" />
  </g>
</svg>
