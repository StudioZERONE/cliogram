<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Elegant & Classy Deep Forest Gradient -->
    <linearGradient id="forest-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    
    <linearGradient id="leaf-soft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <linearGradient id="trunk-subtle" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#042f2e" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Clean Full-Bleed Elegant Background (No Grey Outer Borders) -->
  <rect width="512" height="512" rx="112" fill="url(#forest-deep)"/>

  <!-- Enlarged Classy Forest Pine & River Symbol (Filling Frame Comfortably) -->
  <g filter="url(#soft-glow)">
    <!-- Background Forest Layer -->
    <path d="M190 290 L238 190 L212 190 L248 125 L228 125 L256 75 L284 125 L264 125 L300 190 L274 190 L322 290 Z" fill="#065f46" opacity="0.75"/>
    
    <!-- Main Noble Center Tree Layer -->
    <path d="M256 100 L150 260 H195 L120 370 H220 V430 H292 V370 H392 L317 260 H362 Z" fill="url(#leaf-soft)"/>
    
    <!-- Flowing River Curved Stream -->
    <path d="M100 440 C 180 415, 230 455, 310 435 C 370 420, 410 430, 442 435" fill="none" stroke="#a7f3d0" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
