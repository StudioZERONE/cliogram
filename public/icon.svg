<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 10시(0%, 0%) -> 4시(100%, 100%) 단순 2색 스무스 숲 그라데이션 (100% Solid) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>

  <!-- 1. 배경: 둥근 모서리 사각형 (10시 -> 4시 부드러운 숲 그라데이션) -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>

  <!-- 2. 모던 미니멀 기하학 숲 심볼 (알파값 0% - 100% Solid 정통 벡터) -->
  <g>
    <!-- [뒤쪽 숲 레이어 - 좌측 상록수 (에메랄드 솔리드)] -->
    <path d="M155 170 L95 285 H130 L75 385 H235 L180 285 H215 Z" fill="#047857" />

    <!-- [뒤쪽 숲 레이어 - 우측 상록수 (딥 틸 솔리드)] -->
    <path d="M357 170 L297 285 H332 L277 385 H437 L382 285 H417 Z" fill="#0f766e" />

    <!-- [전면 메인 상록수 - 기둥] -->
    <rect x="238" y="380" width="36" height="46" rx="4" fill="#ffffff" />

    <!-- [전면 메인 상록수 - 좌측 반면 (순백색 Solid)] -->
    <!-- 하단 3단 -->
    <path d="M256 240 L135 380 H256 Z" fill="#ffffff" />
    <!-- 중단 2단 -->
    <path d="M256 165 L165 265 H256 Z" fill="#ffffff" />
    <!-- 상단 1단 (깔끔하고 시원한 단일 꼭지점) -->
    <path d="M256 90 L195 185 H256 Z" fill="#ffffff" />

    <!-- [전면 메인 상록수 - 우측 반면 (밝은 소프트 아이스민트 Solid - 모던한 입체 대비)] -->
    <!-- 하단 3단 -->
    <path d="M256 240 L377 380 H256 Z" fill="#d1fae5" />
    <!-- 중단 2단 -->
    <path d="M256 165 L347 265 H256 Z" fill="#d1fae5" />
    <!-- 상단 1단 -->
    <path d="M256 90 L317 185 H256 Z" fill="#d1fae5" />
  </g>
</svg>
