<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 10시(0%, 0%) -> 4시(100%, 100%) 너무 어둡지 않고 맑고 점잖은 에메랄드 숲 그라데이션 -->
    <linearGradient id="bg-forest-natural" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#045d47" />
      <stop offset="100%" stop-color="#0d856d" />
    </linearGradient>
  </defs>

  <!-- 1. 배경: 둥근 모서리 사각형 (10시 -> 4시 부드러운 숲 그라데이션) -->
  <rect width="512" height="512" rx="112" fill="url(#bg-forest-natural)"/>

  <!-- 2. 모던 기하학 숲 심볼 (얇지도 뚱뚱하지도 않은 가장 완벽한 황금 밸런스 볼륨) -->
  <g>
    <!-- [좌측 배경 숲 나무]: 중간 볼륨 (#045842) -->
    <!-- 하단 3단 (밑선 Y=385) -->
    <path d="M110 285 H140 L202 385 H48 Z" fill="#045842" />
    <!-- 중단 2단 -->
    <path d="M116 230 H134 L176 305 H74 Z" fill="#045842" />
    <!-- 상단 1단 -->
    <path d="M125 180 L95 248 H155 Z" fill="#045842" />

    <!-- [우측 배경 숲 나무]: 중간 볼륨 (#033d2e) -->
    <!-- 하단 3단 (밑선 Y=385) -->
    <path d="M345 250 H385 L455 385 H275 Z" fill="#033d2e" />
    <!-- 중단 2단 -->
    <path d="M353 190 H377 L430 275 H300 Z" fill="#033d2e" />
    <!-- 상단 1단 -->
    <path d="M365 140 L322 215 H408 Z" fill="#033d2e" />

    <!-- [전면 메인 상록수 - 기둥] -->
    <rect x="238" y="385" width="36" height="42" rx="4" fill="#ffffff" />

    <!-- [전면 메인 상록수 - 좌측 반면 (순백색 Solid, 완벽한 중간 볼륨)] -->
    <!-- 하단 3단 (밑선 Y=385) -->
    <path d="M224 245 H256 V385 H122 Z" fill="#ffffff" />
    <!-- 중단 2단 -->
    <path d="M236 165 H256 V275 H155 Z" fill="#ffffff" />
    <!-- 상단 1단 꼭대기 -->
    <path d="M256 90 L190 195 H256 Z" fill="#ffffff" />

    <!-- [전면 메인 상록수 - 우측 반면 (소프트 아이스민트 Solid, 완벽한 중간 볼륨)] -->
    <!-- 하단 3단 (밑선 Y=385) -->
    <path d="M256 245 H288 L390 385 H256 Z" fill="#e0f7ef" />
    <!-- 중단 2단 -->
    <path d="M256 165 H276 L357 275 H256 Z" fill="#e0f7ef" />
    <!-- 상단 1단 꼭대기 -->
    <path d="M256 90 L322 195 H256 Z" fill="#e0f7ef" />
  </g>
</svg>
